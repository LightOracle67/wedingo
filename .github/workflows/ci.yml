name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Deploy manual desde GitHub Actions (respaldo a la CLI local): se dispara
  # desde la API/UI con el job "deploy" cuando el entorno local no puede
  # construir (p. ej. sandbox con límite de memoria). Los secrets ya están
  # configurados en el repo.
  workflow_dispatch:

# Cancela ejecuciones anteriores del mismo PR/rama al empujar nuevos commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
  VITE_SUPERADMIN_ROUTE: ${{ secrets.VITE_SUPERADMIN_ROUTE }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run translations:check
      - run: npm run consent:check
      # Una sola pasada de Vitest con cobertura y reporte JUnit.
      - run: npx vitest run --coverage --reporter=junit --outputFile=junit.xml --exclude 'e2e/**'
      - run: npm run changelog:check
      - run: npm run audit:prod
      - run: npm run build
      - run: node scripts/check-bundle-size.js

      - uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Vitest Results
          path: junit.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Notify CI failure (commit status)
        if: failure()
        run: echo "::error::CI build-and-test failed. Check the logs."

  # ── STAGING: preview channel por PR ──────────────────────
  preview:
    if: github.event_name == 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
          VITE_SUPERADMIN_ROUTE: ${{ secrets.VITE_SUPERADMIN_ROUTE }}
      - name: Deploy preview channel
        id: preview
        run: |
          npx firebase-tools hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --expires 7d --token "$FIREBASE_TOKEN" --non-interactive 2>&1 | tee /tmp/preview.log
          PREVIEW_URL=$(grep -o 'https://[^ ]*web.app' /tmp/preview.log | head -1)
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Comment preview URL on PR
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            🚀 **Preview disponible:** ${{ steps.preview.outputs.url }}
            *Este enlace expira en 7 días.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    # Los e2e corren contra un webServer local (vite preview) y usan el
    # script test-invite contra Firestore de staging/test: no dependen del
    # canal de producción, así que también cubren PRs (antes solo main).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
          VITE_SUPERADMIN_ROUTE: ${{ secrets.VITE_SUPERADMIN_ROUTE }}

  # ── DEPLOY (manual, alineado con AGENTS.md) ─────────────────────────────
  # El proyecto NO despliega automáticamente en cada push: el deploy se hace
  # manualmente desde la CLI del desarrollador (canal dev → verificación →
  # producción) tras limpiar dist/, correr vitest y verificar el canal.
  # Este job existe solo como respaldo manual desde GitHub Actions.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
          VITE_SUPERADMIN_ROUTE: ${{ secrets.VITE_SUPERADMIN_ROUTE }}
      - name: Deploy to Firebase (hosting + security rules)
        run: npx firebase-tools deploy --only hosting,firestore:rules --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
